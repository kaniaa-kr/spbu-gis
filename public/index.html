<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <title>WebGIS SPBU Kota Pontianak</title>
        <link rel="stylesheet" href="/lib/leaflet/leaflet.css" />
        <link rel="stylesheet" href="/lib/markercluster/MarkerCluster.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="panel">
            <h3>SPBU Kota Pontianak</h3>
            <label
                ><input type="checkbox" id="f-pertalite" checked />
                <span class="dot" style="background: #2e9e4f"></span>
                Pertalite</label
            >
            <label
                ><input type="checkbox" id="f-pertamax" checked />
                <span class="dot" style="background: #d62828"></span>
                Pertamax</label
            >
            <label
                ><input type="checkbox" id="f-dex" checked />
                <span class="dot" style="background: #1d4ed8"></span> Dex</label
            >
            <hr />
            <label
                ><input type="checkbox" id="f-cluster" /> Aktifkan
                cluster</label
            >
            <p id="info">Memuat data...</p>
        </div>
        <div id="map"></div>

        <script src="/lib/leaflet/leaflet.js"></script>
        <script src="/lib/markercluster/leaflet.markercluster.js"></script>
        <script src="app.js"></script>
    </body>
</html>
